plugins {
    id "com.android.library"
    id "kotlin-android"
}

android {

    buildTypes {
        debug {
            buildConfigField APAROK_CLIPBOARD_URI_TYPE, APAROK_CLIPBOARD_URI, APAROK_CLIPBOARD_URI_VALUE
            buildConfigField APAROK_CLIPBOARD_LABEL_TYPE, APAROK_CLIPBOARD_LABEL, APAROK_CLIPBOARD_LABEL_VALUE
        }
        release {
            buildConfigField APAROK_CLIPBOARD_URI_TYPE, APAROK_CLIPBOARD_URI, APAROK_CLIPBOARD_URI_VALUE
            buildConfigField APAROK_CLIPBOARD_LABEL_TYPE, APAROK_CLIPBOARD_LABEL, APAROK_CLIPBOARD_LABEL_VALUE
        }
    }

    namespace 'com.aparokio.aparok.clipboard'
}

dependencies {

    implementation project(':data')
    implementation project(':core-models')

    implementation libs.kotlin
    implementation libs.coroutinesAndroid
    implementation libs.timber

    testImplementation project(":test:utils")
    testImplementation libs.junit
    testImplementation libs.kotlinTest
    testImplementation libs.androidXTestCore
    testImplementation libs.robolectric
    testImplementation libs.coroutineTesting
}