name: Build Aparok APK and release
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  NDK_VERSION: 'r23c'

jobs:
  rebrand-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Mirapakaya"
          git config user.email "330840626+Mirapakaya@users.noreply.github.com"

      - name: Sync latest upstream and rebrand
        run: |
          set -euo pipefail
          # Preserve the workflow file and any custom assets across the upstream reset
          mkdir -p /tmp/aparok-preserve/.github/workflows
          cp .github/workflows/aparok-rebrand.yml /tmp/aparok-preserve/.github/workflows/aparok-rebrand.yml 2>/dev/null || true
          if [[ -d assets ]]; then cp -r assets /tmp/aparok-preserve/assets 2>/dev/null || true; fi

          git remote add upstream https://github.com/anyproto/anytype-kotlin.git
          git fetch upstream main
          git reset --hard upstream/main

          # Restore preserved files
          mkdir -p .github/workflows
          cp /tmp/aparok-preserve/.github/workflows/aparok-rebrand.yml .github/workflows/aparok-rebrand.yml 2>/dev/null || true
          if [[ -d /tmp/aparok-preserve/assets ]]; then
            cp -r /tmp/aparok-preserve/assets assets
          fi

          # Move package directories
          for dir in $(find . -type d -path '*/com/anytypeio/anytype' ! -path './.git/*'); do
            src_root=$(dirname "$(dirname "$(dirname "$dir")")")
            target="$src_root/com/aparokio/aparok"
            mkdir -p "$(dirname "$target")"
            mv "$dir" "$target"
          done
          for dir in $(find . -type d -path '*/io/anytype/app' ! -path './.git/*'); do
            src_root=$(dirname "$(dirname "$(dirname "$dir")")")
            target="$src_root/io/aparoksha/aparok"
            mkdir -p "$(dirname "$target")"
            mv "$dir" "$target"
          done
          find . -type d -empty \( -name 'anytype' -o -name 'app' -o -name 'anytypeio' \) -delete 2>/dev/null || true

          # Text replacements (exclude .github to keep this workflow intact)
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.gradle/*' \
            ! -path '*/build/*' \
            ! -path '*/.idea/*' \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' -o -name '*.gradle' \
               -o -name '*.c' -o -name '*.cpp' -o -name '*.h' \
               -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name '*.pro' \
               -o -name '*.properties' -o -name '*.json' -o -name '*.txt' \
               -o -name '*.kts' -o -name '*.sh' -o -name '*.py' -o -name '*.toml' \
               -o -name '*.proto' \
               -o -name 'Makefile' -o -name 'Gemfile' \) | while read -r f; do
              sed -i \
                -e 's/com\.anytypeio\.anytype/com\.aparokio\.aparok/g' \
                -e 's/com_anytypeio_anytype/com_aparokio_aparok/g' \
                -e 's/io\.anytype\.app/io\.aparoksha\.aparok/g' \
                -e 's/io_anytype_app/io_aparoksha_aparok/g' \
                -e 's/io\/anytype\/app/io\/aparoksha\/aparok/g' \
                -e 's/anytype:\/\//aparok:\/\//g' \
                -e 's/Anytype/Aparok/g' \
                -e 's/anytype/aparok/g' \
                -e 's/ANYTYPE/APAROK/g' \
                "$f"
          done

          # Fix upstream references that the blanket rename broke
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.gradle/*' \
            ! -path '*/build/*' \
            ! -path '*/.idea/*' \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' -o -name '*.gradle' \
               -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' -o -name '*.pro' \
               -o -name '*.properties' -o -name '*.json' -o -name '*.txt' \
               -o -name '*.kts' -o -name '*.sh' -o -name '*.py' -o -name '*.toml' \
               -o -name '*.proto' \) | while read -r f; do
              sed -i \
                -e 's/com\.aparok\./com.anytype./g' \
                -e 's/aparok-heart-android/anytype-heart-android/g' \
                -e 's/aparok-kotlin/anytype-kotlin/g' \
                -e 's/anyproto\/aparok-heart/anyproto\/anytype-heart/g' \
                -e 's/maven\.pkg\.github\.com\/anyproto\/aparok-heart/maven\.pkg\.github\.com\/anyproto\/anytype-heart/g' \
                -e 's/github\.com\/anyproto\/aparok-kotlin/github\.com\/anyproto\/anytype-kotlin/g' \
                -e 's/wiki\.aparok\./wiki\.anytype\./g' \
                "$f"
          done

          # Rename any remaining files/directories that still contain "anytype"
          find . -depth -iname '*anytype*' ! -path './.git/*' ! -path './.github/*' ! -path './.gradle/*' ! -path '*/build/*' ! -path '*/.idea/*' | while read -r f; do
              newname=$(echo "$f" | sed 's/anytype/aparok/Ig')
              if [[ "$f" != "$newname" ]]; then
                  mkdir -p "$(dirname "$newname")"
                  mv "$f" "$newname"
              fi
          done

      - name: Unlock membership status
        run: |
          set -euo pipefail
          mkdir -p domain/src/main/java/com/aparokio/aparok/domain/payments
          cat > domain/src/main/java/com/aparokio/aparok/domain/payments/GetMembershipStatus.kt <<'KT'
          package com.aparokio.aparok.domain.payments

          import com.aparokio.aparok.core_models.membership.Membership
          import com.aparokio.aparok.core_models.membership.MembershipPaymentMethod
          import com.aparokio.aparok.core_models.membership.NameServiceNameType
          import com.aparokio.aparok.domain.base.AppCoroutineDispatchers
          import com.aparokio.aparok.domain.base.ResultInteractor
          import com.aparokio.aparok.domain.block.repo.BlockRepository
          import javax.inject.Inject

          class GetMembershipStatus @Inject constructor(
              dispatchers: AppCoroutineDispatchers,
              private val repo: BlockRepository
          ) : ResultInteractor<GetMembershipStatus.Params, Membership?>(dispatchers.io) {

              override suspend fun doWork(params: Params): Membership? {
                  return Membership(
                      tier = 0,
                      membershipStatusModel = Membership.Status.STATUS_ACTIVE,
                      dateStarted = 0L,
                      dateEnds = Long.MAX_VALUE,
                      isAutoRenew = true,
                      paymentMethod = MembershipPaymentMethod.METHOD_NONE,
                      nameServiceName = "",
                      nameServiceType = NameServiceNameType.ANY_NAME,
                      userEmail = "",
                      subscribeToNewsletter = false
                  )
              }

              data class Params(val noCache: Boolean)
          }
          KT

      - name: Disable Google Play Billing
        run: |
          set -euo pipefail
          mkdir -p payments/src/main/java/com/aparokio/aparok/payments/playbilling
          cat > payments/src/main/java/com/aparokio/aparok/payments/playbilling/BillingClientLifecycle.kt <<'KT'
          package com.aparokio.aparok.payments.playbilling

          import android.app.Activity
          import android.content.Context
          import androidx.lifecycle.DefaultLifecycleObserver
          import androidx.lifecycle.LifecycleOwner
          import com.android.billingclient.api.BillingFlowParams
          import com.android.billingclient.api.ProductDetails
          import com.aparokio.aparok.domain.base.AppCoroutineDispatchers
          import com.aparokio.aparok.payments.models.MembershipPurchase
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          class BillingClientLifecycle(
              private val dispatchers: AppCoroutineDispatchers,
              private val applicationContext: Context,
              private val scope: CoroutineScope
          ) : DefaultLifecycleObserver {

              private val _subscriptionPurchases = MutableStateFlow<BillingPurchaseState>(BillingPurchaseState.NoPurchases)
              val subscriptionPurchases: StateFlow<BillingPurchaseState> = _subscriptionPurchases.asStateFlow()

              private val _builderSubProductWithProductDetails = MutableStateFlow<BillingClientState>(BillingClientState.NotAvailable)
              val builderSubProductWithProductDetails: StateFlow<BillingClientState> = _builderSubProductWithProductDetails.asStateFlow()

              fun setupSubIds(ids: List<String>) {}

              override fun onCreate(owner: LifecycleOwner) {}
              override fun onDestroy(owner: LifecycleOwner) {}

              fun launchBillingFlow(activity: Activity, params: BillingFlowParams): Int {
                  return 0
              }
          }

          sealed class BillingClientState {
              data object Loading : BillingClientState()
              data class Error(val message: String) : BillingClientState()
              data class Connected(val productDetails: List<ProductDetails>) : BillingClientState()
              data object NotAvailable : BillingClientState()
          }

          sealed class BillingPurchaseState {
              data object Loading : BillingPurchaseState()
              data class HasPurchases(
                  val purchases: List<MembershipPurchase>,
                  val isNewPurchase: Boolean
              ) : BillingPurchaseState()
              data object NoPurchases : BillingPurchaseState()
          }
          KT
          # Remove the Play Billing permission from the merged manifest.
          # The permission is injected by the Play Billing library, so add a merger remove node.
          python3 - <<'PY'
          import os, re
          for root, dirs, files in os.walk('app'):
              for name in files:
                  if name == 'AndroidManifest.xml':
                      path = os.path.join(root, name)
                      with open(path, 'r') as f:
                          content = f.read()
                      if 'com.android.vending.BILLING' not in content:
                          # Insert a merger remove node right after the opening <manifest ...> tag.
                          content = re.sub(
                              r'(<manifest[^>]*>)',
                              r'\1\n    <uses-permission android:name="com.android.vending.BILLING" tools:node="remove"/>',
                              content,
                              count=1,
                              flags=re.DOTALL
                          )
                          with open(path, 'w') as f:
                              f.write(content)
          PY

      - name: Generate launcher icons
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 - <<'PY'
          import os
          import glob
          from PIL import Image, ImageDraw, ImageFont

          # Remove any upstream launcher icons so our PNGs don't conflict with existing WEBPs
          for d in [
              'app/src/main/res/mipmap-mdpi',
              'app/src/main/res/mipmap-hdpi',
              'app/src/main/res/mipmap-xhdpi',
              'app/src/main/res/mipmap-xxhdpi',
              'app/src/main/res/mipmap-xxxhdpi',
              'app/src/main/res/mipmap-anydpi-v26'
          ]:
              for f in glob.glob(os.path.join(d, 'ic_launcher*')):
                  os.remove(f)

          def fit_resize(src, target_size):
              w, h = src.size
              ratio = min(target_size[0] / w, target_size[1] / h)
              return src.resize((int(w * ratio), int(h * ratio)), Image.LANCZOS)

          logo_path = 'assets/aparok-logo.png'
          if os.path.exists(logo_path):
              logo_src = Image.open(logo_path).convert('RGBA')
          else:
              # Fallback to a simple A icon if the uploaded logo is missing
              logo_src = None

          if logo_src:
              sizes = [
                  ('app/src/main/res/mipmap-mdpi/ic_launcher.png', 48),
                  ('app/src/main/res/mipmap-hdpi/ic_launcher.png', 72),
                  ('app/src/main/res/mipmap-xhdpi/ic_launcher.png', 96),
                  ('app/src/main/res/mipmap-xxhdpi/ic_launcher.png', 144),
                  ('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png', 192),
              ]
              for path, size in sizes:
                  canvas = Image.new('RGBA', (size, size), (0, 0, 0, 255))
                  scaled = fit_resize(logo_src, (size, size))
                  x = (size - scaled.width) // 2
                  y = (size - scaled.height) // 2
                  canvas.paste(scaled, (x, y), scaled)
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  canvas.save(path)

              os.makedirs('app/src/main/res/mipmap-anydpi-v26', exist_ok=True)

              # Foreground: transparent background with the logo centered and scaled to ~66 dpi-safe area
              fg_size = 108
              fg = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              scaled_fg = fit_resize(logo_src, (int(fg_size * 0.75), int(fg_size * 0.75)))
              x = (fg_size - scaled_fg.width) // 2
              y = (fg_size - scaled_fg.height) // 2
              fg.paste(scaled_fg, (x, y), scaled_fg)
              fg.save('app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.png')

              # Background: solid black to match the logo's look
              bg = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 255))
              bg.save('app/src/main/res/mipmap-anydpi-v26/ic_launcher_background.png')
          else:
              sizes = [
                  ('app/src/main/res/mipmap-mdpi/ic_launcher.png', 48),
                  ('app/src/main/res/mipmap-hdpi/ic_launcher.png', 72),
                  ('app/src/main/res/mipmap-xhdpi/ic_launcher.png', 96),
                  ('app/src/main/res/mipmap-xxhdpi/ic_launcher.png', 144),
                  ('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png', 192),
              ]
              for path, size in sizes:
                  img = Image.new('RGBA', (size, size), color=(0x1A, 0x73, 0xE8, 0xFF))
                  draw = ImageDraw.Draw(img)
                  try:
                      font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size // 2)
                  except Exception:
                      font = ImageFont.load_default()
                  text = 'A'
                  bbox = draw.textbbox((0, 0), text, font=font)
                  w, h = bbox[2] - bbox[0], bbox[3] - bbox[1]
                  draw.text(((size - w) / 2, (size - h) / 2 - bbox[1]), text, font=font, fill=(255, 255, 255, 255))
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  img.save(path)

              os.makedirs('app/src/main/res/mipmap-anydpi-v26', exist_ok=True)
              fg = Image.new('RGBA', (108, 108), color=(0x1A, 0x73, 0xE8, 0xFF))
              draw = ImageDraw.Draw(fg)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 54)
              except Exception:
                  font = ImageFont.load_default()
              bbox = draw.textbbox((0, 0), 'A', font=font)
              w, h = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(((108 - w) / 2, (108 - h) / 2 - bbox[1]), 'A', font=font, fill=(255, 255, 255, 255))
              fg.save('app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.png')

              bg = Image.new('RGBA', (108, 108), color=(0x1A, 0x73, 0xE8, 0xFF))
              bg.save('app/src/main/res/mipmap-anydpi-v26/ic_launcher_background.png')
          PY

      - name: Fetch latest Aparok Core AAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p libs
          latest_url=$(gh api repos/Mirapakaya/aparok-core/releases/latest -q '.assets[] | select(.name == "lib.aar").browser_download_url')
          if [ -z "$latest_url" ]; then
            echo "ERROR: could not find lib.aar in latest aparok-core release"
            exit 1
          fi
          curl -L -o libs/lib.aar "$latest_url"
          sed -i 's/^middlewareVersion = "[^"]*"$/middlewareVersion = "0.99"/' gradle/libs.versions.toml

      - name: Commit and push Aparok identity
        run: |
          git add -A
          git commit -m "Update application identity to Aparok" \
                     -m "- Refresh upstream sources" \
                     -m "- Update package names and strings" \
                     -m "- Update launcher icons" \
                     -m "- Unlock membership status" || true
          git push origin HEAD --force

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Create github.properties
        run: |
          echo "gpr.usr=${{ github.actor }}" > github.properties
          echo "gpr.key=${{ secrets.GITHUB_TOKEN }}" >> github.properties

      - name: Create apikeys.properties
        run: |
          cat > apikeys.properties <<EOF
          amplitude.debug="7a89074cccfe74d8f73d7e3370a35bac"
          amplitude.release="3224193e55d9abcdad1b7ff9e853c77b"
          sentry_dsn="https://b7e10132f5fef2db3c5b1c58d4f184eb@o4512434703040512.ingest.de.sentry.io/4512434712412240"
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore aparok.keystore -alias aparok -keyalg RSA -keysize 2048 -validity 10000 -storepass aparokpass -keypass aparokpass -dname "CN=Aparok"

      - name: Configure release APK
        run: |
          # Compress native libraries and build per-ABI APKs (no universal APK).
          sed -i 's/universalApk true/universalApk false/' app/build.gradle
          sed -i '/^android {/a\    packagingOptions { jniLibs { useLegacyPackaging true } }' app/build.gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :libs:publishToMavenLocal --no-configuration-cache --no-daemon
          ./gradlew :app:assembleRelease --no-configuration-cache --no-daemon -PenableAbiSplits=true -Pandroid.injected.signing.store.file=$PWD/aparok.keystore -Pandroid.injected.signing.store.password=aparokpass -Pandroid.injected.signing.key.alias=aparok -Pandroid.injected.signing.key.password=aparokpass

      - name: Rename APK artifacts
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal*) name="aparok-universal.apk" ;;
              *arm64-v8a*) name="aparok-arm64-v8a.apk" ;;
              *armeabi-v7a*) name="aparok-armeabi-v7a.apk" ;;
              *) continue ;;
            esac
            mv "$f" "app/build/outputs/apk/release/$name"
          done

      - name: Upload APK and create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aparok-release-${{ github.run_number }}
          name: Aparok Release Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/aparok-*.apk
          body: |
            Aparok release APK build.
            - `aparok-universal.apk` – works on all supported devices (recommended).
            - `aparok-arm64-v8a.apk` – smaller, for 64-bit ARM devices only.
            - `aparok-armeabi-v7a.apk` – for older 32-bit ARM devices.
